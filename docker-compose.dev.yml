# Dev overlay (`./deploy.sh --dev`): plain http and `localhost` as the public and issuer host (the local Keycloak itself is
# docker-compose.keycloak.yml). `extra_hosts: localhost:host-gateway` (and localhost-is-host.sh, which drops the loopback
# `localhost` entries and then execs the image's own entrypoint) lets the containers that verify tokens reach the issuer at the
# same URL the browser uses. The same settings for every enabled gateway are generated by deploy.sh
# (.build/docker-compose.dev-gateways.yml). Never deployed in prod.
version: "3.8"

services:
  oauth2-proxy:
    extra_hosts: ["localhost:host-gateway"]
    user: root   # for the /etc/hosts rewrite; su-exec drops back to the image's uid
    entrypoint: ["/localhost-is-host.sh", "su-exec", "65532:65532", "/entrypoint.sh"]
    volumes: ["./dev/localhost-is-host.sh:/localhost-is-host.sh:ro"]
