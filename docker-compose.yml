# Per-user isolated browser sessions + fetch/parse/blob tools.
#   $PUBLIC_SCHEME://$PUBLIC_HOST/tor/mcp     browsers egress via Tor only
#   $PUBLIC_SCHEME://$PUBLIC_HOST/clear/mcp   browsers egress directly (public internet only)
# Auth: an external OIDC IdP (OIDC_ISSUER, Keycloak); `./deploy.sh --dev` adds a local one
# (docker-compose.dev.yml). Set it up with keycloak/setup.sh (realm, scopes, DCR for Claude, a user).
# TLS is terminated in front of nginx (Google LB in prod: PUBLIC_SCHEME=https; dev: http, no TLS).
# Docker Swarm stack (`./deploy.sh`). Swarm notes: `build:` is ignored (deploy.sh builds
# the images), `shm_size`/`security_opt` are unsupported (Chromium runs with
# --disable-dev-shm-usage; entrypoint.sh sets no_new_privs itself).
version: "3.8"

# per replica: memory limit applies to each task; scale with `docker service scale` or RESEARCH_*_REPLICAS
x-research-deploy: &research-deploy
  restart_policy: { condition: any }
  resources:
    limits: { memory: 12g }   # a runaway session can OOM all sessions on this task

x-research: &research
  image: mcp-research:local
  cap_drop: [ALL]
  # NET_ADMIN: entrypoint firewall only, dropped before sessiond/gateway start.
  # The rest is sessiond's (setuid/setgid/chown/kill, DAC_OVERRIDE+FOWNER to sweep session files).
  cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, KILL, DAC_OVERRIDE, FOWNER]
  volumes:
    - research_data:/data
  environment: &research-env
    PUBLIC_HOST: ${PUBLIC_HOST}
    PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
    OIDC_ISSUER: ${OIDC_ISSUER}
    MCP_SCOPE: ${MCP_SCOPE:-}
    RESEARCH_BLOB_URL: ${RESEARCH_BLOB_URL:-file:///data}
    BLOB_TOKEN_SECRET: ${BLOB_TOKEN_SECRET}
    MAX_SESSIONS_TOTAL: ${MAX_SESSIONS_TOTAL:-18}
    MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-3}
    IDLE_TIMEOUT: ${IDLE_TIMEOUT:-1800}
    GATEWAY_PORT: ${GATEWAY_PORT}
    MAX_REPLICAS: ${MAX_REPLICAS:-4}
    REPLICA_SLOT: "{{.Task.Slot}}"   # expanded per task by stack deploy: this replica's slice of tor's SocksPorts

services:
  # Routes by egress and by replica id (see nginx.conf.template). Not on `public`: it connects to IPs taken
  # from URLs, so it may only reach the research replicas, tor and oauth2-proxy (sessions_*, auth).
  nginx:
    image: nginx:1.27
    deploy: { replicas: 1, restart_policy: { condition: any } }
    ports: ["${HTTP_PORT}:80"]
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks: [auth, sessions_tor, sessions_clear]

  # Human SSO for the live view (MCP bearer tokens are verified by the gateways)
  oauth2-proxy:
    image: oauth2-proxy-dcr:local   # built by deploy.sh; registers itself via DCR (oauth2-proxy/entrypoint.sh)
    deploy: { replicas: 1, restart_policy: { condition: any } }
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER}
      MCP_SCOPE: ${MCP_SCOPE:-}   # entrypoint builds the scope list from it: the same one Claude's MCP client gets
      OIDC_ISSUER: ${OIDC_ISSUER}
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      OAUTH2_PROXY_COOKIE_SECRET: ${O2P_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: ${O2P_COOKIE_SECURE:-true}   # deploy.sh: false when PUBLIC_SCHEME=http
      OAUTH2_PROXY_REDIRECT_URL: ${PUBLIC_SCHEME:-https}://${PUBLIC_HOST}/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
    volumes:
      - o2p_state:/state
    networks: [public, auth]   # public: the IdP; auth: nginx

  research-tor:
    <<: *research
    deploy:
      <<: *research-deploy
      replicas: ${RESEARCH_TOR_REPLICAS:-1}
    environment:
      <<: *research-env
      EGRESS: tor
    networks: [sessions_tor, public]   # public: the gateway reaches the IdP; browsers (session uids) are firewalled to tor only

  research-clear:
    <<: *research
    deploy:
      <<: *research-deploy
      replicas: ${RESEARCH_CLEAR_REPLICAS:-1}
    environment:
      <<: *research-env
      EGRESS: clear
    networks: [sessions_clear, public]

  tor:
    image: spider-hoarder-tor:local
    deploy: { replicas: 1, restart_policy: { condition: any } }
    environment:
      MAX_SESSIONS_TOTAL: ${MAX_SESSIONS_TOTAL:-18}
      MAX_REPLICAS: ${MAX_REPLICAS:-4}   # one SocksPort range per research replica
    volumes: [tor_data:/var/lib/tor]
    networks: [tor_egress, sessions_tor]

networks:
  public: { driver: overlay }
  auth: { driver: overlay, internal: true }           # nginx <-> oauth2-proxy only
  tor_egress: { driver: overlay }
  sessions_tor: { driver: overlay, internal: true }   # tor browsers: no internet, only tor:9050+
  sessions_clear: { driver: overlay }                 # clear browsers -> internet (uid firewall blocks private ranges)

volumes:
  tor_data: {}
  research_data: {}
  o2p_state: {}   # oauth2-proxy's DCR registration
