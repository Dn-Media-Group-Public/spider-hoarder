[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-hoarder-sdk"
version = "0.1.0"
description = "spider-hoarder gateway framework: auth, jobs/blobs, session registry, MCP plumbing, driver seam"
requires-python = ">=3.11"
dependencies = [
    "uvicorn[standard]",
    "mcp==1.29.1",
    "httpx",
    "PyJWT[crypto]",
    "fsspec",
    "python-multipart",
]

[project.optional-dependencies]
# S3-compatible stores (scoped credentials need boto3). There is no `gcs` extra on purpose: gcsfs -> google-cloud-storage needs a protobuf that
# blackboxprotobuf's stale `protobuf==3.10.0` pin forbids (blackboxprotobuf is the parser's, parser/pyproject.toml), so the images install
# GCS support in a second step:
#   pip install gcsfs google-auth      (pip only warns about the pin)
# boto3 (scoped credentials, gateway/creds.py) is not a dependency here: a bare one makes pip backtrack to s3fs 0.4.2 and recent aiobotocore has no [boto3]
# extra, so the gateway images install the boto3 that matches the installed botocore in a second step (`pip install --no-deps boto3==<botocore version> s3transfer`)
s3 = ["s3fs>=2024.1"]

[tool.setuptools.packages.find]
include = ["spider_hoarder_sdk*"]
