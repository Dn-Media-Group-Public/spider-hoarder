[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-hoarder-android-sdk"
version = "0.1.0"
description = "Android family of spider-hoarder backends: driver, slot backend, wrapper, slot image, tool server, tool list"
requires-python = ">=3.11"
dependencies = [
    "spider-hoarder-sdk",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["spider_hoarder_android_sdk*"]

[tool.setuptools.package-data]
spider_hoarder_android_sdk = ["*.json", "*.sh", "image/*", "wrapper/Dockerfile", "wrapper/reconcile.sh", "slot/*", "slot/toolserver/*"]
