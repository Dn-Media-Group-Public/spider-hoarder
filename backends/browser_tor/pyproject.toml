[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser_tor"
version = "0.1.0"
description = "Browser sessions with Tor-only egress"
requires-python = ">=3.11"
dependencies = ["spider-hoarder-browser-sdk"]

[project.entry-points."spider_hoarder.backends"]
browser_tor = "browser_tor.descriptor:descriptor"

[tool.setuptools.packages.find]
include = ["browser_tor*"]

[tool.setuptools.package-data]
browser_tor = ["docker-compose.yml", "image/*", "*/Dockerfile", "*/*.sh", "*/*.conf"]
