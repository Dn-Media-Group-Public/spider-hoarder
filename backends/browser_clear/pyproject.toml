[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser_clear"
version = "0.1.0"
description = "Browser sessions with direct internet egress"
requires-python = ">=3.11"
dependencies = ["spider-hoarder-browser-sdk"]

[project.entry-points."spider_hoarder.backends"]
browser_clear = "browser_clear.descriptor:descriptor"

[tool.setuptools.packages.find]
include = ["browser_clear*"]

[tool.setuptools.package-data]
browser_clear = ["docker-compose.yml", "image/*", "*/Dockerfile", "*/*.sh", "*/*.conf"]
